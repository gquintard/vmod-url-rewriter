[package]
name = "vmod_url_rewriter"
version = "0.1.0"
description = "Varnish VMOD rewriting strings with ordered exact/wildcard/regex rules loaded from YAML, to drive redirects"
publish = false
edition = "2024"
rust-version = "1.90.0"
license = "BSD-3-Clause"
repository = "https://github.com/gquintard/vmod-url-rewriter"
authors = ["Guillaume Quintard <guillaume.quintard@gmail.com>"]

[lib]
# rlib lets benches and doctests link against the crate
crate-type = ["cdylib", "rlib"]

[dependencies]
regex-automata = "0.4"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_norway = "0.9"
varnish = "0.8"

[dev-dependencies]
regex = "1"
criterion = "0.8"

[[bench]]
name = "rules"
harness = false

[lints.rust]
unused_qualifications = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
